# The regression table of the converter (destiny/port/d2fo4.py):
#
#   ./port destiny regress [--only NAME]
#
# The program destiny/port/check/regress.py makes the clips of each weapon again in a scratch
# folder (data/destiny/port/work/_regress/NAME) and compares the bytes of each HKX file with
# the baseline clips.
#
#   name           the name of the weapon in this table
#   file           the first-person file (.glb): a path below the data folder
#   set            the set file: a path from the root of the repository
#   first_person   the folders with the baseline clips of the first-person view: paths below
#                  the data folder
#   third_person   the same for the third-person view (the step `third` of the converter)
#   power_armor    the same for the clips of the body in power armor ([third.power_armor])
#
# A baseline folder is the result of the converter before a change. When a change of the
# converter must change a clip, say which clips are different and why (docs/ARCHITECTURE.md,
# "Rules for a change"), make the new baseline, and name its folder here.
# Then run `./port baseline update`, and put baselines.sha256 into git with the change.

[[weapon]]
name = "the_last_word"
file = "destiny/extract/handoff/the_last_word_v1/the_last_word_first_person.glb"
set = "destiny/port/sets/the_last_word.toml"
first_person = [
    "destiny/port/out/the_last_word",
    "mods/TheLastWord/behavior/thelastword/animations/first_person",
    "mods/TexMechanica/behavior/thelastword/animations/first_person",
]
third_person = [
    "mods/TheLastWord/behavior/thelastword/animations/third_person",
    "mods/TexMechanica/behavior/thelastword/animations/third_person",
]

