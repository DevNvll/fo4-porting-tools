# The first-person clips of Hammerhead (Destiny 2, a machine gun) for Fallout 4.
#
#   ./port destiny convert data/destiny/port/extract/hammerhead/hammerhead_first_person.glb \
#       --set destiny/port/sets/hammerhead.toml -o OUT
#
# The names in the comments of this file: extract/ is data/destiny/port/extract/, work/ is
# data/destiny/port/work/, rig/ is data/destiny/port/rig/, and tools/ is destiny/port/tools/.
# A file or a folder that this file names (`folder`, `dyes`, `file`, the files of
# [model.shaders]) is beside the .glb file.
#
# The clip of each game state is from the animation graph of Destiny 2
# (tools/d2states.py, extract/hammerhead/states.json). The weapon tag is machine_gun.
# The template is the combat rifle with each weapon bone of the skeleton: the gun has 12
# moving parts.
template = "combatrifle_parts"
# The hold pose (CLIP:FRAME). It gives the place of the gun in Fallout 4 weapon space, and it
# is the pose "ready" of the clips of [synth].
hold = "fp_042_80BBC9E4:0"
# The pose in the sights, for the clips of [synth]: this clip with the move of [sight].
sighted = "fp_018_80BBC9D5:0"
# The rest place of each part is its place in the hold pose. In the bind pose of the file the
# belt is a straight line to the left of the gun.
part_rest = "hold"

# The aim point of the sight in Fallout 4 weapon space: the center of the reticle on the
# glass of the sight (tools/d2model.py prints it; [model.sight] below). The glass is from
# x -1.2 to 1.2 and from z 13.59 to 16.31, and the housing hides its lowest 0.4 units. The
# clip in the sights of Destiny is the clip of each rifle, and Destiny aligns the sight of
# each weapon when the game runs: in the clip the eye is at z 11.55, which is below this
# sight. Each clip of `clips` gets the move that puts the aim point on the view axis in its
# first frame (3.40 units down): the arms, the hands and the gun move as one body.
[sight]
point = [0.0, 13.87, 14.95]
clips = ["fp_018_80BBC9D5", "fp_048_80BBC9E9"]

# More poses for the clips of [synth].
[poses]
# The sprint loop (sprint_loop, 24 frames) is one pose: no bone moves in it.
sprint = "fp_037_80BBC9E1:0"

# The Fallout 4 bone of each weapon bone of the file. Most bones have a hash in place of a
# name; the part of each one is from its vertices and its motion in the reload.
[bones]
bone_E29E819D = "WeaponMagazine"          # the ammunition box (the reload takes it away)
bone_FA460094 = "WeaponMagazineChild1"    # the belt: 8 links with vertices, from the gun to the box
bone_FA460097 = "WeaponMagazineChild2"
bone_FA460096 = "WeaponMagazineChild3"
bone_FA460091 = "WeaponMagazineChild4"
bone_FA460090 = "WeaponMagazineChild5"
bone_FA460093 = "WeaponExtra1"
bone_FA460092 = "WeaponExtra2"
bone_FA46009D = "WeaponExtra3"
bone_9EE2ED5C = "WeaponOptics1"           # the top cover with the sight (it opens 86 degrees in the reload)
bone_90ACD6F6 = "WeaponOptics2"           # the latch of the cover
# b_charging_handle is WeaponBolt (the kind `bolt` of tools/d2rig.py). b_barrel and
# bone_FA46009C have no vertex.

# Fallout 4 clip = clip of the file.
[clips]
WPNIdleReady = "fp_042_80BBC9E4"          # idle, the first choice, 97 frames, a loop
# The game plays these four now and then in place of the idle. Destiny has two more clips in
# the state idle (the thresholds of the three clips are 0.962, 0.981 and 1.0).
WPNIdleReadyA = "fp_054_80BBC9F1"         # idle, the second choice, 71 frames
WPNIdleReadyB = "fp_023_80BBC9D8"         # idle, the third choice, 51 frames
WPNIdleReadyC = "fp_054_80BBC9F1"
WPNIdleReadyD = "fp_023_80BBC9D8"
WPNIdleSighted = "fp_018_80BBC9D5"        # iron_sight_idle, 97 frames, a loop
# The graph blends this clip into the sighted idle with the weight AimWobble. The reader
# cannot read the vanilla clip, so the clip is the sighted idle: the gun does not wobble.
WPNIdleSightedWobble = "fp_018_80BBC9D5"
WPNFireSingleReady = "fp_009_80BBC9CB"    # fire, 21 frames (the tag machine_gun)
WPNFireSingleReadyA = "fp_009_80BBC9CB"   # the two fire variants of the vanilla graph: the same shot
WPNFireSingleReadyB = "fp_009_80BBC9CB"
WPNFireSingleSighted = "fp_048_80BBC9E9"  # iron_sight_fire, 21 frames (the tag machine_gun)
WPNEquip = "fp_013_80BBC9CF"              # ready, 30 frames
WPNEquipFast = "fp_013_80BBC9CF"
WPNUnEquip = "fp_014_80BBC9D0"            # put_away, 4 frames, and 8 frames of [hold_end]
WPNReload = "fp_008_80BBC9CA"             # reload_empty, reload_full and reload_special, 180 frames
# sprint_enter (fp_039_80BBCA05) and sprint_exit (fp_038_80BBC9E2) have no clip: the Fallout 4
# graph blends from the idle to the sprint loop and back.

# Automatic fire. Fallout 4 clip = the clip of one shot of the file. The clip has the length
# and the events of the vanilla clip with the same name (67 frames, 20 shots), and at each of
# its events weaponFire the shot starts again from its first frame (the gun kicks 1.9 units
# in the first two frames of a shot).
[auto]
WPNFireAutoReadyForward = "fp_009_80BBC9CB"
WPNFireAutoReadyBack = "fp_009_80BBC9CB"
WPNFireAutoSighted = "fp_048_80BBC9E9"

# Events of a clip, more than those that the tools find. {sound} is the sound name of the
# template. The reload gets the events of the box (MagOut at frame 21, MagIn at frame 48) and
# of the charging handle (frames 137 and 145) from the motion of the parts. The tools put
# reloadComplete 2 frames after the box is in; here the cover is open and the belt is not in
# the gun at that time, so the event is 2 frames after the cover is closed (frame 103).
[events]
WPNEquip = [[0, "SoundPlay.{sound}EquipUp"]]
WPNEquipFast = [[0, "SoundPlay.{sound}EquipUpFast"]]
WPNReload = [[105, "reloadComplete"]]

# The last pose of a clip on this count of more frames at its end. The first-person graph of
# the game (GunBehavior, state WPNUnEquip) removes the gun 0.233 s before the end of the
# put-away clip. The Destiny clip is 0.1 s long. With 8 frames the clip is 0.367 s long, and
# the game removes the gun at 0.133 s: after the motion.
[hold_end]
WPNUnEquip = 8

# Clips that the source does not have. Each one takes the rigid motion of the weapon bone
# from the vanilla clip of the template with the same name, against the vanilla ready (or
# sighted) pose, and applies it to the pose "ready" or "sighted" above: the arms, the hands
# and the gun move as one body. The camera bone and the events are those of the vanilla clip.
[synth]
WPNWalkForwardReady = "ready"
WPNWalkForwardSighted = "sighted"
WPNRunForwardReady = "ready"
WPNRunLeftReady = "ready"
WPNRunRightReady = "ready"
WPNRunGunDown = "ready"
WPNJumpImpactLand = "ready"
# The sprint: the motion of the vanilla sprint against its own first frame, on the sprint
# pose of Destiny.
WPNSprint = { pose = "sprint", reference = "wpnsprint" }
# WPNMelee and WPNMeleeBayonet are not here (a large turn of the gun; see destiny/port/README.md).
# The game uses the vanilla clips, with the hands in the pose of the combat rifle.

# One weapon place of a vanilla clip on each frame (the reader cannot read the vanilla
# wpnidlegundown.hkx).
[static]
WPNIdleGunDown = { pose = "ready", vanilla = "wpnrungundown", frame = 0, frames = 30 }

# The third-person clips. Fallout 4 has few third-person clips of its own for a weapon: the
# reload is the one that shows. The source of a clip is a file of tools/d2third.py
# (extract/hammerhead/third_person/STATE.npz): the clip of the player body that the game graph
# has for a machine gun (the weapon type of Hammerhead), with the clip of the gun parts (the
# cover, the belt and the charging handle; the box does not move in the third-person clip).
#   ./port destiny convert FILE.glb --set destiny/port/sets/hammerhead.toml third --third-output DIR
# The third-person reload has 169 frames and the first-person reload has 180. The cover and
# the charging handle move 2 frames earlier in the third-person clip, so each event of the
# first-person reload is 2 frames earlier here.
[third]
folder = "third_person"
# The gun has its place of Destiny against the right shoulder (tools/blender/d3retarget.py).
# Destiny has a machine gun at the hip in its reload: 19 units below the shoulder. The stance
# of Fallout 4 has the gun at the shoulder, and with the motion of Destiny on that place the
# left arm is up to 8 units too short. On the first and the last 8 frames the gun goes from
# the stance to the place of Destiny and back.
gun = "source"
blend = 8

# Fallout 4 clip = state of the file.
[third.clips]
WPNReload = "reload"

# Fallout 4 clip = one frame of a clip of [third.clips], as a pose. The game takes the place
# of the left hand on the gun in third person from the clip WPNAssemblyPose of the weapon.
[third.poses]
WPNAssemblyPose = "WPNReload:0"

# The Fallout 4 model of the gun for an esx project (tools/d2model.py).
[model]
# Meshes/Weapons/NAME/NAME.nif, Materials/Weapons/NAME and Textures/Weapons/NAME
name = "Hammerhead"
# The place of the node ProjectileNode, in Fallout 4 weapon space: the center of the front of
# the barrel (tools/d2points.py: 84 vertices at y 59.7, x -1.66 to 1.66, z 6.79 to 9.85).
muzzle = [0.0, 59.7, 8.32]
# The dyes of the gun (its default shader): the file of tools/d2dyes.py beside the file of the
# gun. 90 percent of the pixels of this gun take a dye; its albedo textures are gray.
dyes = "dyes.json"

# A texture set of the file (the material name) = the name of the Fallout 4 material.
[model.materials]
815296D9 = "Body"         # the gun, the box and the charging handle
81529861 = "Belt"         # the belt and parts of the cover
81529A19 = "Sight"        # the sight on the cover

# More shaders of Destiny for this gun: NAME = the dyes file of tools/d2dyes.py with --shader
# (beside the file of the gun). Each one gets its textures, its materials and its model file
# (Hammerhead + NAME), and the esx project has it as a second receiver part.
#   ./port destiny dyes "Hammerhead" --shader "Golden Trace" \
#       -o data/destiny/port/extract/hammerhead/dyes_golden_trace.json
[model.shaders]
GoldenTrace = "dyes_golden_trace.json"
CalusSelected = "dyes_caluss_selected.json"
Monochromatic = "dyes_monochromatic.json"

# The glass of the sight and the reticle: a second part of the weapon (Hammerhead + Sight).
# `file` is the file of tools/d2reticle.py beside the file of the gun, and `source` is its
# entity with the part of the render stage `reticle`. The extraction of the gun has only the
# opaque parts, so these parts are not in the file of the gun.
[model.sight]
file = "sight.json"
source = "region21_8152995B"
# The vanilla mesh that gives the two effect shaders (esx makes no new effect shader), and
# its two shapes with alpha blending: the first one becomes the glass, the second one the reticle.
template = "Meshes/Weapons/CombatShotgun/CombatShotgunReflexSightDot.nif"
template_shapes = ["TubeGlass:0", "TubeGlass001:0"]
# The scale of the color of the glass in its material. In Destiny the value changes with the
# time, from 1 to 5.5 (the constants 28 to 33 of the material 81529958). A game test with 1
# showed lines that are hard to see (a line is less than one pixel wide at 1280 x 720).
glass_scale = 2.0

# The glass has two materials of the file, and each one is a layer of one texture. The pixel
# shader of each material (extract/hammerhead/sight/TAG_ps.dxbc; tools/dxasm.py prints it)
# gives the rule:
#   color = red x RED + green x GREEN + blue x BLUE   (the three values of the albedo plate)
#   alpha = the green value of the gstack plate
# RED, GREEN and BLUE are values that the game calculates from inputs that the files do not
# name. These are the values with the sight on and with no alarm (the inputs 5 = 1, and
# 0 and 4 = 0): the constants 5, 12 and 20 of the material.
[[model.sight.glass]]
material = "81529958"                 # the octagon with the lines, the two arcs and the border
red = [0.664, 0.0725, 0.0725]         # the lines, the arcs and the glow at the border
green = [0.1218, 0.1218, 0.1218]      # the marks at the left and at the right
blue = [0.5225, 0.5225, 0.5225]       # the border

[[model.sight.glass]]
material = "8152B6AD"                 # three small symbols at the lower edge of the glass
blue = [1.0, 1.0, 1.0]                # the constant 5 (the input 1 = 0)

# The reticle: the quad of the stage `reticle`, with the texture of its material. Its pixel shader:
#   color = red x RED + green x GREEN       (cb0[1] and cb0[2] of the material)
#   picture = blue x color + scene x (1 - alpha x blue)       (alpha: cb0[0].x)
# In Destiny the reticle shows only in the sights (the input 3 of the material is 0.99 or
# more). In Fallout 4 it shows at each time, as the dot of a vanilla reflex sight.
[model.sight.reticle]
material = "8152996A"
texture = "8152B71D"
red = [1.0, 1.0, 1.0]                 # the ring and the bars
green = [2.5, 0.0, 0.0]               # their edge
alpha = 0.5
# The size. The quad of the file is 1.74 x 1.77 cm, and its vertex shader
# (extract/hammerhead/sight/8152996A_vs.dxbc) puts it 2.25 m before the camera (cb0[11].x):
# the player sees it at an angle of 0.44 degrees. `eye` is the eye point of the clip in the
# sights in weapon space (tools/d2points.py prints it). The quad on the glass has the same
# angle from that point: 0.24 units. With no `distance` the quad has the size of the file
# (1.22 units, half the width of the glass): that is too large. `scale` changes the size.
distance = 2.25
eye = [0.0, -17.28, 14.95]
scale = 1.0
# The place of its center on the glass: a texture coordinate of the first glass material (the
# center of the two arcs and of the two lines). The aim point of [sight] must be this place.
center = [0.5, 0.5]

