# The weapon. `esx build` makes the records from this file. `esx help-topic items` gives the keys.
# The template is the vanilla combat rifle: it gives the behavior graph, the sounds, the
# ammunition and the third-person animations. The editor ID of the weapon is Hammerhead.
# Damage, weight, value and ammunition are those of the combat rifle. The capacity is 60
# rounds: a choice (the tools do not read the Destiny value). The reload time is the time of
# the event reloadEnd in WPNReload (frame 147 of 180).
kind = "weapon"
name = "Hammerhead"
prefix = "Hammerhead"
from = "CombatRifle"
damage = 33
capacity = 60
weight = 7.0
value = 75
reload_seconds = 4.9
ammo = "Ammo45Caliber"
model = 'Weapons\HandMade\Recievers\DummyReciever.nif'
# The combat rifle has two animation keywords. AnimsCombatShotgun gives the graphs and the
# clips of each view (the combat rifle has the clips of the combat shotgun). AnimsCombatRifle
# gives one first-person clip of its own (WPNFireSingleSighted). The behavior source of this
# weapon is a copy of AnimsCombatShotgun with the clips of Hammerhead, so the second keyword
# must not stay: it would give the vanilla clip in place of the clip of this weapon.
remove_keywords = ["AnimsCombatRifle"]

# The receiver part has the whole gun, and it is the automatic receiver of the combat rifle:
# Hammerhead is a machine gun. Its mesh has the nodes that the clips move: WeaponMagazine (the
# ammunition box), WeaponMagazineChild1 to 5 and WeaponExtra1 to 3 (the 8 links of the belt),
# WeaponOptics1 (the top cover with the sight), WeaponOptics2 (the latch of the cover) and
# WeaponBolt (the charging handle). The weapon has no barrel, stock or magazine part: they are
# in this mesh, and so is the housing of the sight.
[part.Receiver]
from = "mod_CombatRifle_Receiver_Automatic1"
name = "Black Armory (default shader)"
model = 'Weapons\Hammerhead\Hammerhead.nif'
default = true
recipe = {}

# Shaders of Destiny 2. A shader item of Destiny gives a gun three other dyes. Fallout 4 has
# no dyes, so each shader is a second receiver part with the same mesh and its own textures
# (tools/d2model.py, [model.shaders] of the set file). The player changes the shader at the
# weapons workbench, in the receiver slot.
[part.ReceiverGoldenTrace]
from = "mod_CombatRifle_Receiver_Automatic1"
name = "Golden Trace (shader)"
model = 'Weapons\Hammerhead\HammerheadGoldenTrace.nif'
recipe = {}

[part.ReceiverCalusSelected]
from = "mod_CombatRifle_Receiver_Automatic1"
name = "Calus's Selected (shader)"
model = 'Weapons\Hammerhead\HammerheadCalusSelected.nif'
recipe = {}

[part.ReceiverMonochromatic]
from = "mod_CombatRifle_Receiver_Automatic1"
name = "Monochromatic (shader)"
model = 'Weapons\Hammerhead\HammerheadMonochromatic.nif'
recipe = {}

# The sight part: the glass of the sight with its red graphics, and the reticle
# (tools/d2reticle.py and tools/d2model.py, [model.sight] of the set file). The two shapes have
# an effect material, so they are not in the mesh of the gun: esx makes an effect shader only
# from a template mesh. The mesh of the gun has the connect point P-Scope on the bone
# WeaponOptics1 (the top cover), and this mesh has C-Scope, so the sight moves with the cover.
# The base is the standard sights part of the combat rifle: it changes no value of the weapon.
[part.Sight]
from = "mod_CombatRifle_Scope_SightsIron"
name = "Black Armory holographic sight"
model = 'Weapons\Hammerhead\HammerheadSight.nif'
default = true
recipe = {}

# The recipe of the weapon, at the chemistry station.
[recipe]
workbench = "WorkbenchChemlab"
category = "RecipeUtility"
components = { c_Steel = 12, c_Aluminum = 6, c_Springs = 3, c_Screws = 4 }
