# Hammerhead (the Destiny 2 machine gun) for Fallout 4: the gun model and its first-person
# clips, retargeted to the Fallout 4 first-person rig. `esx build` makes Hammerhead.esp,
# "Hammerhead - Main.ba2" and "Hammerhead - Textures.ba2" in build/release/.
plugin = "Hammerhead.esp"
author = "Port made with esx"
description = "Hammerhead of Destiny 2, with its first-person animations retargeted to the Fallout 4 rig."

# The model file of the gun is in game units.
[meshes]
scale = 1.0
