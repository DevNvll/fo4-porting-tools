[[step]]
id = "famas-part-dbal-picture"
do = "screenshot.take"
args = { name = "fp-dbal", hud = false }


# The next weapon starts in the first-person view.

[[step]]
id = "famas-view-first"
do = "camera.set"
args = { view = "first" }
expect = { view = "first" }

# The three parts together.
[[step]]
id = "famas-all-remove"
do = "console.run"
args = { command = "removeitem ${weapon_famas} 100", target = "player" }

[[step]]
id = "famas-all-give"
do = "item.give"
args = { form = "FAMAS", equip = true, mods = ["FAMASSuppressor", "FAMASScope", "FAMASDBAL"] }
timeout_ms = 20000
expect = { equipped = true, weapon_loaded = true }

[[step]]
id = "famas-all-ammo"
do = "ammo.set"
args = { loaded = 25, reserve = 200 }
expect = { loaded = 25 }

[[step]]
id = "famas-all-draw"
do = "weapon.draw"
args = { drawn = true }
timeout_ms = 20000
expect = { drawn = true, ready = true }

[[step]]
id = "famas-all-weapon"
do = "weapon.get"
expect = { keywords = { contains = "HasSilencer" } }

[[step]]
id = "famas-all-scope"
do = "weapon.get"
expect = { keywords = { contains = "HasScope" } }

[[step]]
id = "famas-all-pictures"
do = "screenshot.orbit"
args = { name = "famas-all", target = "weapon", yaws = [45, 90, 135] }
timeout_ms = 60000
expect = { count = 3 }

[[step]]
id = "famas-all-first-person"
do = "camera.set"
args = { view = "first" }
expect = { view = "first" }

[[step]]
id = "famas-all-picture"
do = "screenshot.take"
args = { name = "fp-all", hud = false }

[[step]]
id = "famas-all-fire"
do = "action.run"
args = { action = "ActionFireSingle" }
timeout_ms = 4000
wait = [{ event = "weaponFire" }]
screenshot = true

# The reload with the three parts, at one fifth of the game speed: three pictures.
[[step]]
id = "famas-all-slow"
do = "console.run"
args = { command = "sgtm 0.2" }

[[step]]
id = "famas-all-reload"
do = "action.run"
args = { action = "ActionReload" }
timeout_ms = 40000
expect = { accepted = true }
wait = [
  { clip_start = "WPNReload", owner = "player_1st" },
  { event = "SoundPlay", payload = "WPNRifleSubmachineGunReloadMagOut" },
]

[[step]]
id = "famas-all-reload-picture-1"
do = "screenshot.take"
args = { name = "reload-all-1", hud = false }

[[step]]
id = "famas-all-reload-picture-2"
do = "screenshot.take"
args = { name = "reload-all-2", hud = false }

[[step]]
id = "famas-all-reload-picture-3"
do = "screenshot.take"
args = { name = "reload-all-3", hud = false }
timeout_ms = 40000
wait = [{ clip_end = "WPNReload", owner = "player_1st" }]

[[step]]
id = "famas-all-normal-speed"
do = "console.run"
args = { command = "sgtm 1" }
