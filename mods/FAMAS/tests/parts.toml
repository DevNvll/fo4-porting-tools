[[step]]
id = "famas-part-scope-picture"
do = "screenshot.take"
args = { name = "fp-scope", hud = false }

# The view through the scope: the game shows the scope overlay.
[[step]]
id = "famas-part-scope-aim"
do = "action.run"
args = { action = "ActionSighted" }
timeout_ms = 5000
wait = [{ clip_start = "WPNIdleSighted", owner = "player_1st" }]

[[step]]
id = "famas-part-scope-aim-picture-1"
do = "screenshot.take"
args = { name = "aim-scope-1", hud = true }

[[step]]
id = "famas-part-scope-aim-picture-2"
do = "screenshot.take"
args = { name = "aim-scope-2", hud = true }

# The part FAMASDBAL on ap_gun_Foregrip. The game attaches a part only to a weapon that the player gets new,
# so the console removes the weapon first. The new weapon has its default parts and this part.

[[step]]
id = "famas-part-dbal-remove"
do = "console.run"
args = { command = "removeitem ${weapon_famas} 100", target = "player" }

[[step]]
id = "famas-part-dbal-form"
do = "form.find"
args = { form = "FAMASDBAL" }
expect = { type = "OMOD" }
save = { part_famasdbal = "form_id" }

[[step]]
id = "famas-part-dbal-give"
do = "item.give"
args = { form = "FAMAS", equip = true, mods = ["FAMASDBAL"] }
timeout_ms = 20000
expect = { equipped = true, weapon_loaded = true }

[[step]]
id = "famas-part-dbal-draw"
do = "weapon.draw"
args = { drawn = true }
timeout_ms = 20000
expect = { drawn = true, ready = true }

[[step]]
id = "famas-part-dbal-weapon"
do = "weapon.get"
expect = { mods = { contains = { form_id = "${part_famasdbal}", name = "DBAL Laser" } }, keywords = { contains = "dn_HasScope_IronSights" } }

[[step]]
id = "famas-part-dbal-pictures"
do = "screenshot.orbit"
args = { name = "famas-dbal", target = "weapon", yaws = [45, 90, 135] }
timeout_ms = 60000
expect = { count = 3 }

[[step]]
id = "famas-part-dbal-first-person"
do = "camera.set"
args = { view = "first" }
